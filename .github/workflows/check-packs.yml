name: Check examples

# Links, YAML and the Build Packs on every pull request; weekly as well, since
# PipesHub's demo data can change under a pack without a change here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python .github/scripts/check_packs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
